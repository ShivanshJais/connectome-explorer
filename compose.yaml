services:
  db:
    image: postgres:18
    restart: unless-stopped
    shm_size: 128mb
    env_file: .env
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - pgdata:/var/lib/postgresql
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080

volumes:
  pgdata: